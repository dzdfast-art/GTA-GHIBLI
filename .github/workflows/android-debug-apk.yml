name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "**.res"
      - "**.json"
      - "**.godot"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build and audit Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          yes | sdkmanager --licenses >/dev/null

      - name: Install Godot 4.7 and Android export templates
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          export-templates: true

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          python3 - <<'PY'
          import json, os
          sdk = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT")
          java = os.environ["JAVA_HOME"]
          if not sdk:
              raise SystemExit("Android SDK path was not provided by setup-android")
          with open(os.path.expanduser("~/.config/godot/editor_settings-4.tres"), "w") as f:
              f.write('[gd_resource type="EditorSettings" format=3]\n[resource]\n')
              f.write("export/android/android_sdk_path = " + json.dumps(sdk) + "\n")
              f.write("export/android/java_sdk_path = " + json.dumps(java) + "\n")
          print("Configured Android SDK and Java paths for Godot.")
          PY

      - name: Audit repository privacy configuration
        run: python tools/privacy_audit.py

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export ARM64 debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android Debug (ARM64)" build/GTA-GHIBLI-debug.apk

      - name: Verify APK archive and Android package
        shell: bash
        run: |
          set -euo pipefail
          test -s build/GTA-GHIBLI-debug.apk
          unzip -t build/GTA-GHIBLI-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/GTA-GHIBLI-debug.apk | tee build/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump permissions build/GTA-GHIBLI-debug.apk | tee build/apk-permissions.txt
          if grep -Eiq 'android\.permission\.(CAMERA|RECORD_AUDIO|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_CONTACTS|WRITE_CONTACTS|GET_ACCOUNTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_BACKGROUND_LOCATION|READ_SMS|RECEIVE_SMS|SEND_SMS|READ_CALL_LOG|WRITE_CALL_LOG|READ_PHONE_STATE|CALL_PHONE)' build/apk-permissions.txt; then
            echo "Unexpected sensitive Android permission found in exported APK."
            exit 1
          fi

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-GHIBLI-Android-debug-APK
          path: |
            build/GTA-GHIBLI-debug.apk
            build/apk-badging.txt
            build/apk-permissions.txt
          if-no-files-found: error
          retention-days: 14
