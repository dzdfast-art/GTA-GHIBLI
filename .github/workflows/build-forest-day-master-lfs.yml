name: Build and store large forest ambience source (Git LFS)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-forest-day-master-lfs.yml"
      - "tools/audio/build_forest_day_master.py"

permissions:
  contents: write

concurrency:
  group: large-forest-master-lfs-main
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audio generator dependency
        run: python -m pip install --disable-pip-version-check "numpy==2.2.6"

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Configure automation identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate real 7-minute WAV source
        run: python tools/audio/build_forest_day_master.py

      - name: Verify source format and size
        run: |
          python - <<'PY'
          import os, wave
          path = "audio/ambience/source_master/willow_forest_day_master_07min.wav"
          size = os.path.getsize(path)
          with wave.open(path, "rb") as wav:
              assert wav.getnchannels() == 2
              assert wav.getsampwidth() == 3
              assert wav.getframerate() == 48000
              assert wav.getnframes() == 48000 * 420
          assert size > 100 * 1024 * 1024, size
          print(f"VERIFIED_SOURCE_BYTES={size}")
          print(f"VERIFIED_SOURCE_MIB={size / (1024 * 1024):.2f}")
          PY
          git check-attr filter -- audio/ambience/source_master/willow_forest_day_master_07min.wav

      - name: Commit the LFS pointer and upload LFS object
        run: |
          git add .gitattributes audio/ambience/source_master/willow_forest_day_master_07min.wav
          git lfs ls-files
          git commit -m "Add original 7-minute forest ambience master via Git LFS"
          git push origin HEAD:main
          git lfs fsck
