name: Daily GTA GHIBLI project health report

on:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Africa/Algiers"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-project-health-main
  cancel-in-progress: false

jobs:
  daily-report:
    name: Measure project, LFS, APK, and CI health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository without downloading large LFS objects
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      - name: Measure tracked project files and Git LFS source objects
        id: measure
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, subprocess
          from pathlib import Path

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [p.decode() for p in raw.split(b"\0") if p]
          tracked_bytes = 0
          lfs_bytes = 0
          lfs_count = 0
          source_bytes = None
          for name in paths:
              path = Path(name)
              if not path.is_file():
                  continue
              size = path.stat().st_size
              logical_size = size
              if size <= 1024:
                  try:
                      data = path.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      data = ""
                  if data.startswith("version https://git-lfs.github.com/spec/v1"):
                      for line in data.splitlines():
                          if line.startswith("size "):
                              logical_size = int(line.split()[1])
                              lfs_bytes += logical_size
                              lfs_count += 1
                              break
              tracked_bytes += logical_size
              if name == "audio/ambience/source_master/willow_forest_day_master_07min.wav":
                  source_bytes = logical_size

          print("## GTA GHIBLI — التقرير اليومي")
          print()
          print(f"- Commit المفحوص: `{os.environ['GITHUB_SHA']}`")
          print(f"- الملفات المتتبعة: **{len(paths):,}**")
          print(f"- الحجم المنطقي للملفات المتتبعة (مع أحجام LFS): **{tracked_bytes:,} bytes / {tracked_bytes/1_000_000:.2f} MB / {tracked_bytes/1_048_576:.2f} MiB**")
          print(f"- كائنات Git LFS: **{lfs_count}** — **{lfs_bytes:,} bytes / {lfs_bytes/1_048_576:.2f} MiB**")
          if source_bytes is not None:
              print(f"- مصدر صوت الغابة: **{source_bytes:,} bytes / {source_bytes/1_048_576:.2f} MiB**")
              print(f"- شرط ملف مصدر أكبر من 100 MiB: **{'متحقق' if source_bytes > 100*1024*1024 else 'غير متحقق'}**")
          print()
          print("> الحجم المنطقي للملفات المتتبعة تقدير مبني على أحجام ملفات Git LFS المعلنة؛ وليس حجم APK أو مساحة التخزين الإجمالية التي يعرضها GitHub.")
          PY

      - name: Check latest Godot validation, Android APK build, and security audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## أحدث نتائج الفحوص" >> "$GITHUB_STEP_SUMMARY"
          for workflow in godot-validation.yml android-debug-apk.yml security-audit.yml; do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=1" --jq '.workflow_runs[0] | if . then "\(.status) / \(.conclusion // "قيد التنفيذ") — \(.html_url)" else "لا توجد نتائج بعد" end')
            echo "- **$workflow:** $result" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Read exact raw APK size from the newest available APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "GTA-GHIBLI-Android-debug-APK" and .expired == false)] | sort_by(.created_at) | last // empty')
          if [ -z "$artifact" ]; then
            echo "- **حجم APK الخام:** لا يوجد artifact صالح حالياً." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          run_id=$(jq -r '.workflow_run.id // empty' <<< "$artifact")
          if [ -z "$run_id" ]; then
            echo "- **حجم APK الخام:** تعذر تحديد تشغيل البناء المرتبط بالـ artifact." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p /tmp/latest-apk
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "GTA-GHIBLI-Android-debug-APK" --dir /tmp/latest-apk
          size_file=$(find /tmp/latest-apk -type f -name apk-size.txt -print -quit)
          if [ -n "$size_file" ]; then
            echo "### حجم APK الخام (من ملف البناء)" >> "$GITHUB_STEP_SUMMARY"
            cat "$size_file" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **حجم APK الخام:** ملف القياس غير موجود داخل artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare report artifact
        run: cp "$GITHUB_STEP_SUMMARY" daily-health-report.md

      - name: Upload daily report
        uses: actions/upload-artifact@v4
        with:
          name: GTA-GHIBLI-daily-health-report
          path: daily-health-report.md
          if-no-files-found: error
          retention-days: 30
