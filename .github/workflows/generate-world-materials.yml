name: Generate original 2K world materials

on:
  push:
    branches:
      - "feat/300mib-original-surface-library-*"
    paths:
      - "tools/generate_world_materials.py"
      - "scripts/world/willow_village.gd"
      - "tests/village_surface_texture_test.gd"
      - ".github/workflows/generate-world-materials.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: world-material-generation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python image tools
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Generate original 2K surface materials
        run: python tools/generate_world_materials.py

      - name: Install Godot 4.7
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          export-templates: false

      - name: Import generated textures
        run: godot --headless --editor --path . --quit

      - name: Validate original 2K material bindings
        run: godot --headless --path . --script res://tests/village_surface_texture_test.gd

      - name: Run world and mobile regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            tests/mobile_controls_regression_test.gd \
            tests/bicycle_controller_test.gd \
            tests/vehicle_controller_test.gd \
            tests/open_world_regions_test.gd \
            tests/terrain_expansion_runtime_test.gd \
            tests/nature_ambience_assets_test.gd
          do
            godot --headless --path . --script "res://$test"
          done

      - name: Commit generated material assets to the pull request branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/environment/materials/hd/detail_2k
          if git diff --cached --quiet; then
            echo "No generated material changes to commit."
            exit 0
          fi
          git commit -m "Add original 2K world surface and normal maps"
          git push origin "HEAD:$HEAD_REF"
          echo "Generated assets committed to $HEAD_REF"
          gh workflow run android-debug-apk.yml --ref "$HEAD_REF"
