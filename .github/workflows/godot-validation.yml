name: Godot validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Import, parse, privacy-audit, and smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Godot 4
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          export-templates: false

      - name: Validate JSON game data
        run: |
          python -m json.tool data/dialogue/mira_intro_ar.json > /dev/null
          python -m json.tool data/missions/mission_001.json > /dev/null
          python -m json.tool data/story/chapter_01_opening.json > /dev/null
          python -m json.tool data/missions/mission_002.json > /dev/null
          python -m json.tool data/missions/mission_003.json > /dev/null
          python -m json.tool data/missions/mission_004.json > /dev/null

      - name: Audit Android privacy permissions
        run: python tools/privacy_audit.py

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Parse gameplay scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            res://main.gd \
            res://scripts/audio/nature_ambience.gd \
            res://scripts/player/player_controller.gd \
            res://scripts/vehicles/driveable_car.gd \
            res://scripts/systems/player_interactor.gd \
            res://scripts/systems/interactable_door.gd \
            res://scripts/systems/carryable_prop.gd \
            res://scripts/systems/npc_brain.gd \
            res://scripts/camera/third_person_camera.gd \
            res://scripts/ui/mobile_controls.gd \
            res://scripts/ui/virtual_joystick.gd \
            res://scripts/world/willow_village.gd \
            res://scripts/characters/mira_npc.gd \
            res://scripts/missions/mission_manager.gd \
            res://scripts/missions/cinematic_director.gd
          do
            echo "Checking $script"
            godot --headless --path . --check-only --script "$script"
          done

      - name: Test NPC perception and reactions
        run: godot --headless --path . --script res://tests/npc_brain_test.gd

      - name: Test shared interaction contract
        run: godot --headless --path . --script res://tests/interaction_system_test.gd

      - name: Test interactive objects
        run: godot --headless --path . --script res://tests/interactable_objects_test.gd

      - name: Test first vehicle enter-drive-exit flow
        run: godot --headless --path . --script res://tests/vehicle_controller_test.gd

      - name: Test mobile joystick, player movement, and camera touch isolation
        run: godot --headless --path . --script res://tests/mobile_controls_regression_test.gd

      - name: Test first mission objective flow
        run: godot --headless --path . --script res://tests/mission_manager_test.gd

      - name: Run main scene smoke test
        run: godot --headless --path . --quit-after 180
