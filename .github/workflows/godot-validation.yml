name: Godot validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Import, parse, privacy-audit, and smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Godot 4
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          export-templates: false

      - name: Validate JSON game data
        run: |
          python -m json.tool data/dialogue/mira_intro_ar.json > /dev/null
          python -m json.tool data/missions/mission_001.json > /dev/null
          python -m json.tool data/story/chapter_01_opening.json > /dev/null
          python -m json.tool data/story/world_encyclopedia.json > /dev/null
          python -m json.tool data/missions/mission_002.json > /dev/null
          python -m json.tool data/missions/mission_003.json > /dev/null
          python -m json.tool data/missions/mission_004.json > /dev/null
          python -m json.tool data/world/side_activities.json > /dev/null
          python -m json.tool data/items/consumables.json > /dev/null
          python -m json.tool data/world/wildlife_catalog.json > /dev/null
          python -m json.tool data/characters/world_dialogue_ar.json > /dev/null
          python -m json.tool data/world/wildlife_audio_manifest.json > /dev/null
          python -m json.tool data/world/canonical_world.json > /dev/null
          python -m json.tool audio/ambience/manifest.json > /dev/null

      - name: Validate OBJ mesh surface budgets
        run: python tools/validate_obj_surface_counts.py

      - name: Validate OBJ material library references
        run: python tools/validate_obj_material_references.py


      - name: Audit project device-data privacy
        run: python tools/privacy_audit.py

      - name: Audit offline dialogue audio in Web builds
        run: python tools/web_dialogue_privacy_audit.py

      - name: Import project resources
        run: timeout 300 godot --headless --editor --path . --quit

      - name: Test canonical world locations and Marsa Al-Noor
        run: timeout 300 godot --headless --path . --script res://tests/canonical_world_locations_test.gd

      - name: Parse gameplay scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            res://main.gd \
            res://scripts/audio/nature_ambience.gd \
            res://scripts/player/player_controller.gd \
            res://scripts/player/humanoid_visual.gd \
            res://scripts/world/ambient_traffic_car.gd \
            res://scripts/world/ambient_traffic_director.gd \
            res://scripts/vehicles/driveable_car.gd \
            res://scripts/vehicles/bicycle_controller.gd \
            res://scripts/world/house_interior_portal.gd \
            res://scripts/ui/world_map_view.gd \
            res://scripts/systems/player_interactor.gd \
            res://scripts/systems/interactable_door.gd \
            res://scripts/systems/carryable_prop.gd \
            res://scripts/systems/npc_brain.gd \
            res://scripts/systems/player_needs.gd \
            res://scripts/systems/consumable_inventory.gd \
            res://scripts/systems/player_wallet.gd \
            res://scripts/systems/player_health.gd \
            res://scripts/systems/game_save_manager.gd \
            res://scripts/world/consumable_shop.gd \
            res://scripts/world/seafood_market.gd \
            res://scripts/world/public_drinking_fountain.gd \
            res://scripts/world/vehicle_service_garage.gd \
            res://scripts/world/coastal_lighthouse.gd \
            res://scripts/camera/third_person_camera.gd \
            res://scripts/ui/mobile_controls.gd \
            res://scripts/ui/game_hud.gd \
            res://scripts/ui/minimap_radar.gd \
            res://scripts/missions/video_reference_tutorial.gd \
            res://scripts/ui/pause_settings_menu.gd \
            res://scripts/ui/virtual_joystick.gd \
            res://scripts/world/willow_village.gd \
            res://scripts/characters/mira_npc.gd \
            res://scripts/characters/world_npc_actor.gd \
            res://scripts/characters/story_character_director.gd \
            res://scripts/missions/mission_manager.gd \
            res://scripts/missions/mission_002_runtime.gd \
            res://scripts/missions/mission_003_runtime.gd \
            res://scripts/missions/mission_004_runtime.gd \
            res://scripts/world/side_activity_director.gd \
            res://scripts/world/world_clock.gd \
            res://scripts/world/open_world_regions.gd \
            res://scripts/world/terrain_expansion_runtime.gd \
            res://scripts/world/wildlife_actor.gd \
            res://scripts/world/wildlife_director.gd \
            res://scripts/audio/wildlife_voice.gd \
            res://scripts/world/world_weather.gd \
            res://scripts/missions/cinematic_director.gd
          do
            echo "Checking $script"
            timeout 300 godot --headless --path . --check-only --script "$script"
          done

      - name: Test pause menu and saved settings
        run: timeout 300 godot --headless --path . --script res://tests/pause_settings_menu_test.gd

      - name: Test player wallet and currency
        run: timeout 300 godot --headless --path . --script res://tests/player_wallet_test.gd

      - name: Test unified game save manager
        run: timeout 300 godot --headless --path . --script res://tests/game_save_manager_test.gd

      - name: Test village shop purchases
        run: timeout 300 godot --headless --path . --script res://tests/consumable_shop_test.gd

      - name: Test public drinking fountain interaction
        run: timeout 300 godot --headless --path . --script res://tests/public_drinking_fountain_test.gd

      - name: Test Sapphire Coast seafood market purchases
        run: timeout 300 godot --headless --path . --script res://tests/seafood_market_test.gd

      - name: Test Amber Valley vehicle service garage
        run: timeout 300 godot --headless --path . --script res://tests/vehicle_service_garage_test.gd

      - name: Test Sapphire Coast lighthouse beacon and interaction
        run: timeout 300 godot --headless --path . --script res://tests/coastal_lighthouse_test.gd

      - name: Test food and drink inventory
        run: timeout 300 godot --headless --path . --script res://tests/consumable_inventory_test.gd

      - name: Test player hunger, thirst and rest
        run: timeout 300 godot --headless --path . --script res://tests/player_needs_test.gd

      - name: Test NPC perception and reactions
        run: timeout 300 godot --headless --path . --script res://tests/npc_brain_test.gd

      - name: Test named Arabic character population and interaction
        run: timeout 300 godot --headless --path . --script res://tests/character_population_test.gd

      - name: Test shared interaction contract
        run: timeout 300 godot --headless --path . --script res://tests/interaction_system_test.gd

      - name: Test interactive objects
        run: timeout 300 godot --headless --path . --script res://tests/interactable_objects_test.gd

      - name: Test first vehicle enter-drive-exit flow
        run: timeout 300 godot --headless --path . --script res://tests/vehicle_controller_test.gd

      - name: Test vehicle damage, repairs, and condition visuals
        run: timeout 300 godot --headless --path . --script res://tests/vehicle_damage_repair_test.gd

      - name: Test bicycle mount, riding controls, and dismount
        run: timeout 300 godot --headless --path . --script res://tests/bicycle_controller_test.gd

      - name: Test house interior entry and exit
        run: timeout 300 godot --headless --path . --script res://tests/house_interior_portal_test.gd

      - name: Test video-reference bicycle, house, and red bridge world integration
        run: timeout 300 godot --headless --path . --script res://tests/video_reference_world_flow_test.gd

      - name: Test shared touch-input regression (headless simulation; no device required)
        run: timeout 300 godot --headless --path . --script res://tests/mobile_controls_regression_test.gd

      - name: Test Web desktop keyboard and mouse controls
        run: timeout 300 godot --headless --path . --script res://tests/web_keyboard_controls_test.gd

      - name: Test first mission objective flow
        run: timeout 300 godot --headless --path . --script res://tests/mission_manager_test.gd

      - name: Test rescue mission 002 progression and escape
        run: timeout 300 godot --headless --path . --script res://tests/mission_002_runtime_test.gd

      - name: Test harbor stealth investigation mission 003
        run: timeout 300 godot --headless --path . --script res://tests/mission_003_runtime_test.gd

      - name: Test last train escort mission 004
        run: timeout 300 godot --headless --path . --script res://tests/mission_004_runtime_test.gd

      - name: Test original ambience audio assets
        run: timeout 300 godot --headless --path . --script res://tests/nature_ambience_assets_test.gd

      - name: Test Arabic voice emotion and acting directions
        run: timeout 300 godot --headless --path . --script res://tests/voice_performance_data_test.gd

      - name: Test named audio buses and routing
        run: timeout 300 godot --headless --path . --script res://tests/audio_bus_layout_test.gd

      - name: Test global weather transitions
        run: timeout 300 godot --headless --path . --script res://tests/world_weather_test.gd

      - name: Test wildlife habitat population and feeding
        run: timeout 300 godot --headless --path . --script res://tests/wildlife_director_test.gd

      - name: Test four open-world districts
        run: timeout 300 godot --headless --path . --script res://tests/open_world_regions_test.gd

      - name: Test GTA San Andreas Mobile visual reference profile
        run: timeout 300 godot --headless --path . --script res://tests/graphics_reference_profile_test.gd

      - name: Test regional terrain expansion attachment
        run: timeout 300 godot --headless --path . --script res://tests/terrain_expansion_runtime_test.gd

      - name: Test world clock and day-night phases
        run: timeout 300 godot --headless --path . --script res://tests/world_clock_test.gd

      - name: Test optional world side activities and wallet rewards
        run: timeout 300 godot --headless --path . --script res://tests/side_activity_director_test.gd

      - name: Test video-reference gameplay HUD overlay
        run: timeout 300 godot --headless --path . --script res://tests/gameplay_hud_overlay_test.gd

      - name: Test continuous video-reference bicycle and house tutorial
        run: timeout 300 godot --headless --path . --script res://tests/video_reference_tutorial_test.gd

      - name: Test original humanoid player visual
        run: timeout 300 godot --headless --path . --script res://tests/player_humanoid_visual_test.gd

      - name: Test moving ambient traffic on village roads
        run: timeout 300 godot --headless --path . --script res://tests/ambient_traffic_test.gd

      - name: Run main scene smoke test
        run: timeout 300 godot --headless --path . --quit-after 180
