name: GTA GHIBLI Fresh Web Edition CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - web/standalone-from-empty-2026-11-22
      - 'feature/web-*'
    paths:
      - "web-edition/**"
      - ".github/workflows/web-edition-ci.yml"
      - ".github/scripts/web-edition-browser-smoke.cjs"
      - ".github/scripts/web-edition-save-reload.cjs"
      - ".github/scripts/web-edition-save-blocked-storage.cjs"
      - ".github/scripts/web-edition-save-browser-restart.cjs"
      - "docs/WEB_EDITION_*.md"
  pull_request:
    branches:
      - main
      - 'feature/web-*'
    paths:
      - "web-edition/**"
      - ".github/workflows/web-edition-ci.yml"
      - ".github/scripts/web-edition-browser-smoke.cjs"
      - ".github/scripts/web-edition-save-reload.cjs"
      - ".github/scripts/web-edition-save-blocked-storage.cjs"
      - ".github/scripts/web-edition-save-browser-restart.cjs"
      - "docs/WEB_EDITION_*.md"

permissions:
  contents: read

concurrency:
  group: gta-ghibli-fresh-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-export:
    name: Godot 4.7 Web export and Chromium validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out standalone Web project
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          lfs: false

      - name: Install Godot 4.7 and Web export templates
        uses: SolarLabyrinth/Action-Setup-Godot@6ca948845e6489770ebb3be5fd1cc4589c65b8ad
        with:
          version: 4.7-stable
          export-templates: true

      - name: Validate project JSON data
        run: |
          python3 -m json.tool web-edition/data/world/regions.json >/dev/null
          python3 -m json.tool web-edition/data/missions/mission_001.json >/dev/null
          python3 -m json.tool web-edition/data/missions/mission_002.json >/dev/null
          python3 -m json.tool web-edition/data/missions/mission_003.json >/dev/null
          python3 -m json.tool web-edition/data/story/cast.json >/dev/null

      - name: Validate research registry and helper tools
        run: |
          python3 -m json.tool docs/research/gtasa_registry.json >/dev/null
          python3 -m py_compile web-edition/tools/research_helper.py
          python3 -m unittest discover -s web-edition/tests -p 'test_*.py' -v

      - name: Import the new standalone Godot project
        run: godot --headless --editor --path web-edition --quit

      - name: Run every Web Edition GDScript regression test
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(web-edition/tests/*_test.gd)
          if (("${#tests[@]}" == 0)); then
            echo "No GDScript regression tests were found."
            exit 1
          fi
          for test_file in "${tests[@]}"; do
            test_name="${test_file##*/}"
            test_log="$(mktemp)"
            echo "::group::Running ${test_name}"
            test_status=0
            if timeout 20s godot --headless --quit-after 600 --path web-edition --script "res://tests/${test_name}" >"$test_log" 2>&1; then
              test_status=0
            else
              test_status=$?
            fi
            cat "$test_log"
            if (( test_status != 0 )); then
              rm -f "$test_log"
              echo "::endgroup::"
              echo "::error::${test_name} exited with status ${test_status}."
              exit "$test_status"
            fi
            if grep -Eqi 'ERROR:|Parse Error:|Assertion failed|Invalid call[.]' "$test_log"; then
              rm -f "$test_log"
              echo "::endgroup::"
              echo "::error::${test_name} logged a GDScript/runtime assertion error."
              exit 1
            fi
            rm -f "$test_log"
            echo "::endgroup::"
          done
          echo "Executed ${#tests[@]} GDScript regression tests with runtime-error detection."

      - name: Measure tracked Web source bytes and unique content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess

          raw_paths = subprocess.check_output(["git", "ls-files", "-z", "web-edition"])
          paths = [os.fsdecode(path) for path in raw_paths.split(bytes([0])) if path]
          unique_content = {}
          tracked_bytes = 0
          for path in paths:
              with open(path, "rb") as handle:
                  content = handle.read()
              tracked_bytes += len(content)
              unique_content.setdefault(hashlib.sha256(content).hexdigest(), len(content))
          unique_bytes = sum(unique_content.values())
          print(f"WEB_SOURCE_TRACKED_FILES={len(paths)}")
          print(f"WEB_SOURCE_TRACKED_BYTES={tracked_bytes}")
          print(f"WEB_SOURCE_TRACKED_MB_DECIMAL={tracked_bytes / 1_000_000:.3f}")
          print(f"WEB_SOURCE_UNIQUE_CONTENTS={len(unique_content)}")
          print(f"WEB_SOURCE_UNIQUE_BYTES={unique_bytes}")
          print(f"WEB_SOURCE_UNIQUE_MIB={unique_bytes / 1_048_576:.3f}")
          PY

      - name: Export WebAssembly game
        run: |
          mkdir -p web-edition/build/web
          godot --headless --path web-edition --export-release "Web" build/web/index.html

      - name: Verify Web export files
        shell: bash
        run: |
          set -euo pipefail
          test -s web-edition/build/web/index.html
          wasm_file="$(find web-edition/build/web -maxdepth 1 -type f -name '*.wasm' -print -quit)"
          pck_file="$(find web-edition/build/web -maxdepth 1 -type f -name '*.pck' -print -quit)"
          js_file="$(find web-edition/build/web -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$wasm_file"
          test -n "$pck_file"
          test -n "$js_file"
          python3 - "$pck_file" <<'PY'
          import sys
          from pathlib import Path
          pack = Path(sys.argv[1]).read_bytes()
          forbidden = (b"tests/web_save_probe.gd", b"tests/web_save_probe.tscn", b"WebSaveReloadProbe")
          leaked = [marker.decode("ascii") for marker in forbidden if marker in pack]
          if leaked:
              raise SystemExit("CI-only browser probe leaked into the normal game PCK: " + ", ".join(leaked))
          print("PASS: CI-only browser probe scene and script are excluded from the normal game PCK.")
          PY
          echo "HTML, JavaScript, WebAssembly and PCK are present."

      - name: Install pinned Chromium
        run: |
          mkdir -p /tmp/gta-ghibli-playwright
          npm install --prefix /tmp/gta-ghibli-playwright playwright@1.55.0
          /tmp/gta-ghibli-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Test Web runtime in Chromium on localhost
        env:
          NODE_PATH: /tmp/gta-ghibli-playwright/node_modules
        run: node .github/scripts/web-edition-browser-smoke.cjs

      - name: Export temporary live-game save-reload probe
        shell: bash
        run: |
          set -euo pipefail
          original_project="${RUNNER_TEMP}/gta-ghibli-project.godot"
          original_preset="${RUNNER_TEMP}/gta-ghibli-export-presets.cfg"
          cp web-edition/project.godot "$original_project"
          cp web-edition/export_presets.cfg "$original_preset"
          restore_project() {
            cp "$original_project" web-edition/project.godot
            cp "$original_preset" web-edition/export_presets.cfg
          }
          trap restore_project EXIT
          python3 - <<'PY'
          from pathlib import Path
          project_path = Path("web-edition/project.godot")
          project = project_path.read_text(encoding="utf-8")
          old_scene = 'run/main_scene="res://scenes/main.tscn"'
          new_scene = 'run/main_scene="res://tests/web_save_probe.tscn"'
          if project.count(old_scene) != 1:
              raise SystemExit("Could not safely select the temporary save-probe main scene.")
          project_path.write_text(project.replace(old_scene, new_scene), encoding="utf-8")

          preset_path = Path("web-edition/export_presets.cfg")
          preset = preset_path.read_text(encoding="utf-8")
          excluded_tests = 'exclude_filter="tests/*"'
          include_probe = 'exclude_filter=""'
          if preset.count(excluded_tests) != 1:
              raise SystemExit("Could not safely include the temporary probe scene in its CI-only export.")
          preset_path.write_text(preset.replace(excluded_tests, include_probe), encoding="utf-8")
          PY
          godot --headless --editor --path web-edition --quit
          mkdir -p web-edition/build/save-probe
          godot --headless --path web-edition --export-release "Web" build/save-probe/index.html
          test -s web-edition/build/save-probe/index.html
          restore_project
          trap - EXIT

      - name: Verify live-game save across Chromium page reload
        env:
          NODE_PATH: /tmp/gta-ghibli-playwright/node_modules
        run: node .github/scripts/web-edition-save-reload.cjs

      - name: Verify live-game saves across Chromium process restart
        env:
          NODE_PATH: /tmp/gta-ghibli-playwright/node_modules
        run: node .github/scripts/web-edition-save-browser-restart.cjs

      - name: Verify session-only behavior when IndexedDB is blocked
        env:
          NODE_PATH: /tmp/gta-ghibli-playwright/node_modules
        run: node .github/scripts/web-edition-save-blocked-storage.cjs

      - name: Package Web export and record exact size and hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web-edition/build
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          source = Path("web-edition/build/web")
          output = Path("web-edition/build/GTA-GHIBLI-Web.zip")
          repeat = Path("web-edition/build/GTA-GHIBLI-Web-repeat.zip")

          def write_archive(target: Path) -> None:
              with ZipFile(target, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
                  for path in sorted(item for item in source.rglob("*") if item.is_file()):
                      info = ZipInfo(
                          path.relative_to(source).as_posix(),
                          date_time=(2020, 1, 1, 0, 0, 0)
                      )
                      info.create_system = 3
                      info.external_attr = 0o100644 << 16
                      info.compress_type = ZIP_DEFLATED
                      archive.writestr(
                          info,
                          path.read_bytes(),
                          compress_type=ZIP_DEFLATED,
                          compresslevel=9
                      )

          write_archive(output)
          write_archive(repeat)
          first_hash = hashlib.sha256(output.read_bytes()).hexdigest()
          repeat_hash = hashlib.sha256(repeat.read_bytes()).hexdigest()
          if first_hash != repeat_hash:
              raise SystemExit("The temporary Web ZIP is not reproducible.")
          repeat.unlink()
          print("WEB_ZIP_REPRODUCIBLE=true")
          print(f"WEB_ZIP_SHA256_CHECK={first_hash}")
          PY
          bytes="$(stat -c%s web-edition/build/GTA-GHIBLI-Web.zip)"
          python3 - "$bytes" <<'PY' > web-edition/build/web-size.txt
          import hashlib
          import os
          import sys
          size = int(sys.argv[1])
          print(f"WEB_ZIP_BYTES={size}")
          print(f"WEB_ZIP_MB_DECIMAL={size / 1_000_000:.3f}")
          print(f"WEB_ZIP_MIB={size / 1_048_576:.3f}")
          with open("web-edition/build/GTA-GHIBLI-Web.zip", "rb") as handle:
              print(f"WEB_ZIP_SHA256={hashlib.sha256(handle.read()).hexdigest()}")
          total = 0
          files = 0
          for root, _, names in os.walk("web-edition/build/web"):
              for name in names:
                  total += os.path.getsize(os.path.join(root, name))
                  files += 1
          print(f"WEB_EXPORT_FILES={files}")
          print(f"WEB_EXPORT_BYTES={total}")
          print(f"WEB_EXPORT_MIB={total / 1_048_576:.3f}")
          PY
          cat web-edition/build/web-size.txt

      - name: Remove temporary Web export and package
        if: always()
        run: rm -rf web-edition/build
