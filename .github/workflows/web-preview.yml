name: GTA GHIBLI Web Preview (Private CI Only)

on:
  push:
    branches:
      - web-preview
  workflow_dispatch:

permissions: {}

concurrency:
  group: gta-ghibli-web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/web-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out the isolated preview branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # immutable checkout action commit
        with:
          persist-credentials: false
          lfs: false

      - name: Install Godot 4.7 and Web export templates
        uses: SolarLabyrinth/Action-Setup-Godot@6ca948845e6489770ebb3be5fd1cc4589c65b8ad # immutable action commit
        with:
          version: 4.7-stable
          export-templates: true

      - name: Run privacy audits
        run: |
          python tools/privacy_audit.py
          python tools/web_privacy_audit.py

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Test mobile controls and camera isolation
        run: godot --headless --path . --script res://tests/mobile_controls_regression_test.gd

      - name: Test ambience asset loading and transitions
        run: godot --headless --path . --script res://tests/nature_ambience_assets_test.gd

      - name: Export browser build locally on the temporary runner
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web Preview" build/web/index.html

      - name: Install pinned Chromium for private browser testing
        run: |
          mkdir -p /tmp/gta-ghibli-playwright
          npm install --prefix /tmp/gta-ghibli-playwright playwright@1.55.0
          /tmp/gta-ghibli-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Run private Chromium Web runtime smoke test
        env:
          NODE_PATH: /tmp/gta-ghibli-playwright/node_modules
        run: node .github/scripts/web_browser_smoke_test.cjs

      - name: Verify Web export and exclude sensitive build files
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          wasm_file="$(find build/web -type f -name '*.wasm' -print -quit)"
          pck_file="$(find build/web -type f -name '*.pck' -print -quit)"
          test -n "$wasm_file"
          test -n "$pck_file"

          forbidden_file="$(find build/web -type f \( -name '.env' -o -name '.env.*' -o -name '*.keystore' -o -name '*.jks' -o -name '*.p12' \) -print -quit)"
          if [ -n "$forbidden_file" ]; then
            echo "A secret or signing-key file was found in the Web export: $forbidden_file"
            exit 1
          fi

          large_source="$(find build/web -type f -iname '*.wav' -size +50M -print -quit)"
          if [ -n "$large_source" ]; then
            echo "An uncompressed source master was included in the Web export: $large_source"
            exit 1
          fi

          echo "Private CI Web export verified:"
          find build/web -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          du -sh build/web

      # The build stays on the temporary GitHub-hosted runner. No Pages deployment,
      # artifact upload, public download link, or cross-job publishing is configured.

  remove-previous-public-preview-artifacts:
    if: always() && github.ref == 'refs/heads/web-preview'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete previously uploaded public Web preview artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_ids="$(gh api --paginate --jq '.artifacts[] | select(.name == "GTA-GHIBLI-Web-Preview") | .id' "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100")"
          if [ -z "$artifact_ids" ]; then
            echo "No previous public Web preview artifacts remain."
            exit 0
          fi
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            echo "Deleting previous public Web preview artifact ID: $artifact_id"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id"
          done <<< "$artifact_ids"
          echo "Previous GTA-GHIBLI-Web-Preview artifacts have been deleted."
