      <path d="M7 18 Q96 9 185 18 M8 91 Q96 100 184 91" fill="none" stroke="#4e291f" stroke-width="3" opacity=".42"/>
      <path d="M18 25 Q92 18 174 25" fill="none" stroke="#c77a57" stroke-width="2" opacity=".24"/>
      <path d="M24 74l17 -4 M128 46l20 -4 M72 55l11 -2" stroke="#d08a68" stroke-width="2" opacity=".18"/>
    </g>
  </pattern>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="2" seed="23"/><feColorMatrix values=".32 0 0 0 .25 0 .22 0 0 .15 0 0 .18 0 .11 0 0 0 .15 0"/></filter>
</defs>
