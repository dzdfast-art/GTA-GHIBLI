<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<title>GTA GHIBLI terracotta roof tile material</title>
<desc>Original seamless hand-arranged clay roof shingle texture with offset courses, baked clay variation, edge shadows and subtle weathering.</desc>
<defs>
  <linearGradient id="clay" x1="0" y1="0" x2="0.18" y2="1"><stop stop-color="#a85d3e"/><stop offset=".48" stop-color="#88432f"/><stop offset="1" stop-color="#5d3026"/></linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="0.1" y2="1"><stop stop-color="#bd7350"/><stop offset=".18" stop-color="#a85c40"/><stop offset=".78" stop-color="#89432f"/><stop offset="1" stop-color="#653126"/></linearGradient>
  <pattern id="courses" width="192" height="112" patternUnits="userSpaceOnUse">
    <rect width="192" height="112" fill="#51291f"/>
    <g>
      <path d="M-4 2 Q-4 -5 8 -5 H184 Q196 -5 196 7 V99 Q196 108 185 108 H7 Q-4 108 -4 98Z" fill="url(#tile)" stroke="#4b281f" stroke-width="5"/>
