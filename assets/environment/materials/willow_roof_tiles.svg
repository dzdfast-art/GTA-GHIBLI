<rect x="-96" y="-56" width="1216" height="1136" fill="url(#courses)"/>
<g fill="none" stroke-linecap="round" opacity=".2">
  <path d="M40 220l20 -7 M332 338l31 -8 M780 177l22 -9 M904 722l28 -6 M188 849l19 -5 M625 936l25 -8" stroke="#e6aa83" stroke-width="5"/>
