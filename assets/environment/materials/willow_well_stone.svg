<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048">
<title>GTA GHIBLI weathered village limestone</title>
<desc>Original warm limestone blocks with chipped edges, mineral grain, mortar joints and subtle weathering for Willow Village.</desc>
<defs>
